[project]
name = "keysteppro-tool"
version = "0.1.0"
description = "Convert between Standard MIDI files and Arturia KeyStep Pro project files"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mido>=1.3.3",
    "orjson>=3.11.9",
    # Rich is not listed: nothing imports it. It is reached only through Typer's
    # own rich_markup_mode and rich_help_panel arguments, and typer requires it.
    "typer>=0.15",
]

# Reading a project off the device needs raw USB, and libusb is a system
# dependency most users have no reason to install. ksp_cli.usb_transport
# imports pyusb lazily and says to install this extra when it is missing.
[project.optional-dependencies]
usb = ["pyusb>=1.3.1"]

# Console entry points land with the milestones that implement them.
# Declaring one before its module exists would install a command that crashes
# on invocation, so they are added alongside the code.
[project.scripts]
kspplus = "ksp_cli.app:main"
ksp-dump = "ksp_cli.dump:main"
ksp2midi = "ksp_cli.export:main"
midi2ksp = "ksp_cli.convert:main"
ksp-pull = "ksp_cli.pull:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ksp", "src/ksp_cli"]
# midi2ksp overwrites a template rather than synthesising 153,495 keys, so the
# factory default ships with it. Without this the installed command has nothing
# to convert into.
artifacts = ["src/ksp_cli/templates/*.KeyStepPro"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5.0",
    "mypy>=1.11",
    "ruff>=0.6",
    "pre-commit>=3.8",
    "pyusb>=1.3.1",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
# Ruff formats Python snippets embedded in Markdown. The documents in
# `analysis/` record an externally-defined format and their examples are
# transcriptions, not code we own the style of -- letting the formatter
# rewrite them would corrupt the spec.
#
# `swift/` is the M8 port. Ruff only ever lints .py/.pyi/.ipynb so it is inert
# there today, but `ruff check .` walks the whole tree -- `src` above is import
# resolution, not file discovery -- so exclude it before a stray script lands.
# mypy needs no equivalent: `files` below is an explicit list.
extend-exclude = ["*.md", "swift"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.mypy]
strict = true
files = ["src", "tests", "tools"]

# These ship no py.typed, so strict mode rejects the import outright.
[[tool.mypy.overrides]]
module = ["mido.*", "usb.*"]
ignore_missing_imports = true

# Hand-run investigation scripts that nothing imports. Strict mode charged
# annotation work here for no safety in return -- there is no caller to protect.
# The other tools stay strict: tests import usb_probe, reduce_timing and
# timing_diff, so those do have callers.
[[tool.mypy.overrides]]
module = [
    "bifurcate_log",
    "convert_sysex_json_to_jsonl",
    "ksp_proxy",
    "sysex_diff",
    "usb_test",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -q --tb=short --maxfail=1"
markers = [
    "hardware: requires a physical KeyStep Pro (deselect with -m 'not hardware')",
    "slow: marks tests as slow integration/e2e tests (skipped during AI validation)",
]
