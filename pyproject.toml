[project]
name = "keysteppro-tool"
version = "0.1.0"
description = "Convert between Standard MIDI files and Arturia KeyStep Pro project files"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mido>=1.3.3",
    "orjson>=3.11.9",
]

# Console entry points land with the milestones that implement them.
# Declaring one before its module exists would install a command that crashes
# on invocation, so they are added alongside the code.
[project.scripts]
ksp-dump = "ksp_cli.dump:main"
ksp2midi = "ksp_cli.export:main"
midi2ksp = "ksp_cli.convert:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ksp", "src/ksp_cli"]
# midi2ksp overwrites a template rather than synthesising 153,495 keys, so the
# factory default ships with it. Without this the installed command has nothing
# to convert into.
artifacts = ["src/ksp_cli/templates/*.KeyStepPro"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5.0",
    "mypy>=1.11",
    "ruff>=0.6",
    "pre-commit>=3.8",
    "pyusb>=1.3.1",
    "python-rtmidi>=1.5.8",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
# Ruff formats Python snippets embedded in Markdown. The documents in
# `analysis/` record an externally-defined format and their examples are
# transcriptions, not code we own the style of -- letting the formatter
# rewrite them would corrupt the spec.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.mypy]
strict = true
files = ["src", "tests", "tools"]

# mido and rtmidi ship no py.typed, so strict mode rejects the import outright.
[[tool.mypy.overrides]]
module = ["mido.*", "rtmidi.*"]
ignore_missing_imports = true

# mido ships no type information, so its symbols arrive as Any. Confined to
# ksp/midi_export.py and its tests; everything else stays fully checked.
[[tool.mypy.overrides]]
module = "mido.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -q --tb=short --maxfail=1"
markers = [
    "hardware: requires a physical KeyStep Pro (deselect with -m 'not hardware')",
    "slow: marks tests as slow integration/e2e tests (skipped during AI validation)",
    "fast: marks explicit core unit tests"
]
